
@if (obj) {
    <!-- Number Type -->
    @if (obj.type == 'number') {
        <mat-form-field appearance="outline" class="inline-editing-field" >
            <input matInput type="number" [formControl]="numberCtrl">
        </mat-form-field>
    }
    
    <!-- String Type -->
    @if (obj.type == 'string') {
        <mat-form-field appearance="outline" class="inline-editing-field">
            <input matInput type="text" [formControl]="stringCtrl">
        </mat-form-field>
    }
    @if (obj.type == 'date') {
        <mat-form-field appearance="outline" class="inline-editing-field">
            <input matInput type="date" [formControl]="dateCtrl">
        </mat-form-field>
    }
    <!-- Selection Type -->
    @if (obj.type == 'selection') {
        <mat-form-field appearance="outline" class="inline-editing-field">
            <mat-select [value]="" [formControl]="selectionCtrl">
                @for (option of obj.options; track option) {
                    <mat-option [value]="option">{{option}}</mat-option>
                }
            </mat-select>
        </mat-form-field>
    }
    <!-- Boolean Type -->
    @if (obj.type == 'boolean') {
        <mat-checkbox (click)="$event.stopPropagation()" color="primary" [formControl]="booleanCtrl"></mat-checkbox>
    }
}
